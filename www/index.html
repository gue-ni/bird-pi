<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vögel im Garten(weg)</title>
  <style>
    html {
      color-scheme: light dark;
    }

    body {
      width: 90%;
      margin: 0 auto;
      padding: 1em;
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }


    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .gallery video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
  <script src="//unpkg.com/alpinejs" defer></script>
  <script>
    function imageGallery(url) {
      return {
        images: [],
        start_timestamp: null,
        end_timestamp: null,
        getImages() {
          if (this.start_timestamp && this.end_timestamp) {
            const start = new Date(this.start_timestamp);
            const end = new Date(this.end_timestamp);
            console.log("filter");

            let filtered = this.images.filter((img) => {
              let date = new Date(img.mtime);
              return start <= date && date <= end;
            });

            filtered.reverse();
            return filtered.slice(512);

          } else {
            console.log("no filter")
            return this.images.slice(0, 512);
          }
        },
        async fetchImages() {
          try {
            const response = await fetch(url);
            const data = await response.json();

            const options = {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              hour: 'numeric',
              minute: 'numeric',
              second: 'numeric',
              timeZone: 'Europe/Berlin',
              hour12: false
            };

            let modified = data.map(image => {
              let date = new Date(image.mtime);
              let locale_date_string = date.toLocaleDateString('de-DE', options);
              return { ...image, src: `${url}${image.name}`, locale_date_string };
            })

            modified.sort((a, b) => new Date(b.mtime) - new Date(a.mtime));

            console.log(modified[0])

            this.images = modified
          } catch (error) {
            console.error("Error fetching images:", error);
          }
        }
      };
    }
  </script>

</head>

<body>
  <h1>Vögel im Garten(weg)</h1>
  <p>
    Zur kontinuierlichen Erhebung des Vogelbestandes (Erfassung der Flugbewegungen) wurde an einem Futterhäußchen im
    Gartenweg in Ludesch, Vorarlberg
    eine Kamera mit Bewegungsauslöser installiert.
  </p>
  <p>
    &copy; 2024 Jakob Maier Dietmar Maier
  </p>
  <h2>Zeitraffer</h2>
  <p></p>
  <div x-data="imageGallery('./videos/')" x-init="fetchImages()" class="gallery">
    <template x-for="image in images" :key="image.name">
      <div>
        <video :src="image.src" controls></video>
        <div>
          <small x-text="image.locale_date_string"></small>
        </div>
        <div>
          <a :href="image.src" download>download</a>
        </div>
      </div>
    </template>
  </div>
  <h2>Galerie</h2>
  <div x-data="imageGallery('./images/')" x-init="fetchImages()">
    <div style="padding: 1em;">
      <label for="start_timestamp">Start:</label>
      <input id="start_timestamp" type="datetime-local" x-model="start_timestamp" />
    </div>
    <div style="padding: 1em;">
      <label for="end_timestamp">End:</label>
      <input id="end_timestamp" type="datetime-local" x-model="end_timestamp" />
    </div>
    <div class="gallery">
      <template x-for="image in getImages()" :key="image.name">
        <div>
          <img loading="lazy" :src="image.src" :alt="image.alt" />
          <div>
            <small x-text="image.locale_date_string"></small>
          </div>
          <div>
            <a :href="image.src" download>download</a>
          </div>
        </div>
      </template>
    </div>
  </div>

</body>

</html>
