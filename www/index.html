<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vögel im Garten(weg)</title>
  <style>
    html {
      color-scheme: light dark;
    }

    body {
      width: 90%;
      margin: 0 auto;
      padding: 1em;
      font-family: Tahoma, Verdana, Arial, sans-serif;
    }


    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .gallery video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }
  </style>
  <script src="//unpkg.com/alpinejs" defer></script>
  <script>

    const timer = ms => new Promise(res => setTimeout(res, ms))

    function imageGallery(url) {
      return {
        images: [],
        async fetchImages() {
          try {
            const response = await fetch(url);
            const data = await response.json();

            const options = {
              year: 'numeric',
              month: 'long',
              day: 'numeric',
              hour: 'numeric',
              minute: 'numeric',
              second: 'numeric', // e.g., "15"
              timeZone: 'Europe/Berlin', // Use the Berlin time zone
              hour12: false      // Use 24-hour format (default in German)
            };

            let modified = data.map(image => {
              let date = new Date(image.mtime);
              let locale_date_string = date.toLocaleDateString('de-DE', options);
              return { ...image, src: `${url}${image.name}`, locale_date_string };
            })

            modified.sort((a, b) => new Date(b.mtime) - new Date(a.mtime));
            modified = modified.slice(0, 512)

            console.log(modified[0])

            this.images = modified
          } catch (error) {
            console.error("Error fetching images:", error);
          }
        },
        async fetchImagesLoop() {
          this.fetchImages();
          setTimeout(this.fetchImagesLoop, 5000)
        }
      };
    }
  </script>

</head>

<body>
  <h1>Vögel im Garten(weg)</h1>
  <p>
    Zur kontinuierlichen Erhebung des Vogelbestandes (Erfassung der Flugbewegungen) wurde an einem Futterhäußchen im Gartenweg
    eine Kamera mit Bewegungsauslöser installiert.
  </p>
  <p>
    &copy; 2024 Jakob Maier Dietmar Maier
  </p>

  <h2>Zeitraffer</h2>
  <p></p>
  <div x-data="imageGallery('./videos/')" x-init="fetchImages()" class="gallery">
    <template x-for="image in images" :key="image.name">
      <div>
        <video :src="image.src" controls></video>
        <div>
          <small x-text="image.locale_date_string"></small>
        </div>
        <div>
          <a :href="image.src" download>download</a>
        </div>
      </div>
    </template>
  </div>

  <h2>Galerie</h2>
  <p></p>
  <div x-data="imageGallery('./images/')" x-init="fetchImages()" class="gallery">
    <template x-for="image in images" :key="image.name">
      <div>
        <img loading="lazy" :src="image.src" :alt="image.alt" />
        <div>
          <small x-text="image.locale_date_string"></small>
        </div>
        <div>
          <a :href="image.src" download>download</a>
        </div>
      </div>
    </template>
  </div>

</body>

</html>
